<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D0E12'/%3E%3Crect x='7' y='7' width='23' height='23' rx='5' fill='%231FAD5C'/%3E%3Crect x='34' y='7' width='23' height='23' rx='5' fill='%23FFD43B'/%3E%3Crect x='7' y='34' width='23' height='23' rx='5' fill='%23D7263D'/%3E%3Crect x='34' y='34' width='23' height='23' rx='5' fill='%231F6FEB'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cube Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #EDF0F5;
  --paper: #FFFFFF;
  --ink: #17191F;
  --ink-soft: #596173;
  --line: #D3D9E3;
  --frame: #17191F;
  --btn-border: #17191F;
  --yellow: #FFD23F;
  --coach: #E0337F;
  --coach-soft: rgba(224, 51, 127, .30);
  --unknown: #C5CBD6;
  --q: rgba(23, 25, 31, .38);
  --glow: rgba(255, 255, 255, .95);
  --shadow: rgba(23, 25, 31, .30);
  --display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif;
  --text: 'Andika', 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0F1218; --paper: #1A1E27; --ink: #EEF1F6; --ink-soft: #A2AABA; --line: #2C3240;
    --frame: #05060A; --btn-border: #3A4152; --unknown: #4A5163; --q: rgba(255, 255, 255, .42);
    --coach: #FF4D9A; --coach-soft: rgba(255, 77, 154, .32);
    --glow: rgba(110, 130, 185, .24); --shadow: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0F1218; --paper: #1A1E27; --ink: #EEF1F6; --ink-soft: #A2AABA; --line: #2C3240;
  --frame: #05060A; --btn-border: #3A4152; --unknown: #4A5163; --q: rgba(255, 255, 255, .42);
  --coach: #FF4D9A; --coach-soft: rgba(255, 77, 154, .32);
  --glow: rgba(110, 130, 185, .24); --shadow: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%;
  background: var(--desk); color: var(--ink);
  font: 400 18px/1.45 var(--text);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
  overflow-x: clip;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coach); outline-offset: 3px; }

.app { max-width: 520px; margin: 0 auto; padding: 8px 18px 28px; }
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 21px/1 var(--display); letter-spacing: -0.01em; }
.logo { width: 28px; height: 28px; padding: 3px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #0D0E12; border-radius: 8px; }
.logo i { border-radius: 3px; }
.restart {
  appearance: none; cursor: pointer; background: transparent; color: var(--ink-soft);
  border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px;
  font: 500 15px/1 var(--display); touch-action: manipulation;
}
.restart.armed { color: var(--ink); border-color: var(--coach); }
.app[data-screen="welcome"] .restart { visibility: hidden; }

/* The cube stage */
.stage { position: relative; height: clamp(180px, 27vh, 280px); margin: 0 -18px; transition: height .5s cubic-bezier(.4, 0, .2, 1); pointer-events: none; overflow-x: clip; }
.app[data-big] .stage { height: clamp(230px, 40vh, 390px); }
.stage::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: min(80vw, 380px); aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, var(--glow) 0%, transparent 66%);
}
.floor {
  position: absolute; left: 50%; bottom: 6%; width: 42%; max-width: 210px; height: 18px;
  transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, var(--shadow), transparent);
}
.scene {
  position: absolute; inset: 0; display: grid; place-items: center; perspective: 1100px;
  transition: opacity .22s ease, transform .5s cubic-bezier(.4, 0, .2, 1);
}
.app[data-big] .scene { transform: scale(1.3); }
.scene.fade { opacity: 0; }
.spinner, .cube { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
.spinner.spinning { animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotateY(-360deg); } }
.cube { transition: transform 1.2s cubic-bezier(.45, .05, .2, 1); }
.cubie { position: absolute; transform-style: preserve-3d; }
.face {
  position: absolute; left: 0; top: 0; background: #0D0E12; border-radius: 9%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.stk {
  position: absolute; inset: 7.5%; border-radius: 15%; background: var(--unknown);
  box-shadow: inset 0 -0.2em 0 rgba(0, 0, 0, .14), inset 0 0.12em 0 rgba(255, 255, 255, .35);
}
.arrow { position: absolute; pointer-events: none; transition: opacity .18s ease; }
.arrow.hide { opacity: 0; }
.arrow svg, .move-icon svg { width: 100%; height: 100%; display: block; overflow: visible; }
.a-out, .a-mid, .a-core { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.a-out { stroke: rgba(13, 14, 18, .55); stroke-width: 32; }
.a-mid { stroke: #fff; stroke-width: 25; }
.a-core { stroke: var(--coach); stroke-width: 15; }
.a-out-h { fill: rgba(13, 14, 18, .55); stroke: rgba(13, 14, 18, .55); stroke-width: 15; stroke-linejoin: round; }
.a-mid-h { fill: #fff; stroke: #fff; stroke-width: 9; stroke-linejoin: round; }
.a-core-h { fill: var(--coach); stroke: var(--coach); stroke-width: 1; stroke-linejoin: round; }
.a-badge { fill: #0D0E12; stroke: #fff; stroke-width: 4; }
.a-badge-t { fill: #fff; font: 700 26px var(--display); }
.mini-stk { fill: #9AA3B5; }

/* Panel */
.panel { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; text-align: center; padding-top: 2px; }
.progress { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font: 500 15px/1.2 var(--display); color: var(--ink-soft); }
.chips { display: flex; gap: 5px; }
.chip { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--line); }
.chip.done { background: var(--ink); border-color: var(--ink); }
.chip.now { background: var(--yellow); border-color: #17191F; }
.key { font: 600 14px/1 var(--display); color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 8px; padding: 4px 8px; }
h1 { font: 600 clamp(26px, 7vw, 32px)/1.12 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0 auto; max-width: 31ch; color: var(--ink-soft); text-wrap: pretty; }
.note { margin: 0 auto; max-width: 31ch; font-size: 16px; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; }

/* A cube face you can paint */
.face-grid {
  width: min(54vw, 208px); aspect-ratio: 1; margin: 0 auto; padding: 10px;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px;
  background: #0D0E12; border-radius: 24px; box-shadow: 0 7px 0 rgba(13, 14, 18, .22);
}
.cell {
  appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 15px;
  background: var(--c, var(--unknown));
  box-shadow: inset 0 -7px 0 rgba(0, 0, 0, .14), inset 0 4px 0 rgba(255, 255, 255, .3);
  font: 600 30px/1 var(--display); color: var(--q);
  display: grid; place-items: center; touch-action: manipulation; transition: transform .1s ease;
}
.cell:active { transform: scale(.94); }
.cell.pop { animation: pop .24s ease; }
@keyframes pop { 45% { transform: scale(1.08); } }
.cell.flag { box-shadow: 0 0 0 4px var(--coach), inset 0 -7px 0 rgba(0, 0, 0, .14); animation: flag 1.1s ease-in-out infinite; }
@keyframes flag { 50% { box-shadow: 0 0 0 4px var(--coach), 0 0 0 10px var(--coach-soft), inset 0 -7px 0 rgba(0, 0, 0, .14); } }
.face-grid.mini { width: 96px; padding: 7px; gap: 7px; border-radius: 16px; box-shadow: none; }
.face-grid.mini .cell { border-radius: 9px; cursor: default; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14); }
.face-grid.mini .cell.flag { box-shadow: 0 0 0 3px var(--coach), inset 0 -4px 0 rgba(0, 0, 0, .14); animation-name: flag-mini; }
@keyframes flag-mini { 50% { box-shadow: 0 0 0 3px var(--coach), 0 0 0 8px var(--coach-soft), inset 0 -4px 0 rgba(0, 0, 0, .14); } }
.face-grid.check { width: 148px; padding: 8px; gap: 8px; border-radius: 20px; }
.face-grid.check .cell { border-radius: 12px; cursor: default; }
.minis { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.minis figure { margin: 0; display: grid; gap: 8px; justify-items: center; font: 500 15px/1 var(--display); color: var(--ink-soft); }

.preview { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.edge-tag {
  position: relative; font: 600 15px/1 var(--display); color: #17191F; background: var(--yellow);
  border: 2px solid #17191F; border-radius: 999px; padding: 6px 14px;
}
.edge-tag::before { content: ""; position: absolute; left: 50%; transform: translateX(-50%); border: 8px solid transparent; }
.edge-tag.below::before { top: -16px; border-bottom-color: #17191F; }
.edge-tag.above::before { bottom: -16px; border-top-color: #17191F; }

/* Colors */
.palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; max-width: 420px; margin: 0 auto; }
.sw {
  appearance: none; background: none; border: 0; padding: 6px 0 2px; cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  font: 400 14px/1 var(--text); color: var(--ink-soft); touch-action: manipulation;
}
.sw .dot {
  width: 44px; height: 44px; border-radius: 12px; background: var(--c);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .14), 0 0 0 2px var(--line);
  transition: transform .12s ease, box-shadow .12s ease;
}
.sw[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.sw[aria-pressed="true"] .dot { transform: translateY(-3px); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .14), 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.sw .over {
  position: absolute; top: 0; left: calc(50% + 12px); min-width: 22px; padding: 3px 5px; border-radius: 10px;
  background: var(--coach); color: #fff; font: 600 13px/1 var(--display);
}
.warn { margin: 0 auto; max-width: 32ch; font-size: 16px; color: var(--ink); }
.warn b { color: var(--coach); }

/* Buttons */
.actions { display: flex; gap: 12px; margin-top: 4px; }
.btn {
  flex: 1; appearance: none; cursor: pointer; min-height: 58px; padding: 14px 16px;
  font: 600 19px/1.1 var(--display); color: var(--ink); background: var(--paper);
  border: 3px solid var(--btn-border); border-radius: 16px; box-shadow: 0 5px 0 var(--frame);
  transition: transform .08s ease, box-shadow .08s ease, opacity .2s ease; touch-action: manipulation;
}
.btn.primary { background: var(--yellow); color: #17191F; border-color: #17191F; box-shadow: 0 5px 0 #17191F; }
.btn.wide { flex: 2; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--frame); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 #17191F; }
.btn:disabled { opacity: .4; cursor: default; }
.textlink {
  appearance: none; align-self: center; background: none; border: 0; padding: 6px 8px; cursor: pointer;
  color: var(--ink-soft); font: 400 16px/1.3 var(--text); text-decoration: underline; text-underline-offset: 3px;
}

/* Welcome steps */
.howto { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 10px; text-align: left; max-width: 330px; }
.howto li { display: flex; align-items: center; gap: 12px; }
.howto b {
  flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  font: 600 18px/1 var(--display); color: #17191F; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .14);
}

/* Moves */
.move-head { display: flex; align-items: center; justify-content: center; gap: 14px; }
.move-icon { width: 58px; height: 58px; flex: none; }
.move-head h1 { text-align: left; }
.help { text-align: left; font-size: 16px; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.help p { margin: 0; }

/* Confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i {
  position: absolute; top: -24px; width: 11px; height: 11px; border-radius: 3px; background: var(--c);
  animation: fall var(--t) cubic-bezier(.25, .6, .45, 1) var(--d) forwards;
}
@keyframes fall { to { transform: translate3d(var(--x), 112vh, 0) rotate(var(--r)); } }

@media (max-width: 360px) {
  .app { padding-left: 14px; padding-right: 14px; }
  .stage { margin: 0 -14px; }
  .sw .dot { width: 38px; height: 38px; }
  .btn { font-size: 17px; }
}
@media (max-height: 720px) {
  .stage { height: clamp(128px, 20vh, 220px); }
  .app[data-big] .stage { height: clamp(200px, 35vh, 320px); }
  .panel { gap: 10px; }
  h1 { font-size: 24px; }
  .lead { font-size: 16px; max-width: 38ch; }
  .face-grid { width: min(52vw, 27vh, 208px); }
  .face-grid.check { width: 128px; }
  .sw .dot { width: 36px; height: 36px; }
  .sw { gap: 3px; }
  .btn { min-height: 52px; padding: 11px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .stage, .scene, .cube { transition-duration: .01s !important; }
  .spinner.spinning, .cell.flag, .face-grid.mini .cell.flag, .cell.pop { animation: none; }
}

/* Cube choice */
.choose { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 2px; }
.tile {
  appearance: none; cursor: pointer; display: grid; justify-items: center; gap: 8px; padding: 16px 10px 14px;
  color: var(--ink); background: var(--paper); border: 3px solid var(--btn-border); border-radius: 20px;
  box-shadow: 0 6px 0 var(--frame); transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation;
}
.tile:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--frame); }
.tile .ico { width: 64px; height: 64px; padding: 5px; display: grid; gap: 3px; background: #0D0E12; border-radius: 13px; }
.tile .ico i { border-radius: 4px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); }
.tile .ico.n2 { grid-template-columns: repeat(2, 1fr); }
.tile .ico.n3 { grid-template-columns: repeat(3, 1fr); gap: 2.5px; }
.tile .ico.n3 i { border-radius: 3px; }
.tile strong { font: 600 28px/1 var(--display); letter-spacing: -0.01em; }
.tile small { font: 400 15px/1.2 var(--text); color: var(--ink-soft); }

/* 3x3 faces */
.face-grid.n3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 7px; padding: 9px; }
.face-grid.n3 .cell { border-radius: 11px; font-size: 22px; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .14), inset 0 3px 0 rgba(255, 255, 255, .3); }
.face-grid.n3 .cell.flag { box-shadow: 0 0 0 4px var(--coach), inset 0 -5px 0 rgba(0, 0, 0, .14); }
.cell.center { cursor: default; }
.cell.center::after { content: ""; width: 24%; aspect-ratio: 1; border-radius: 50%; background: rgba(13, 14, 18, .22); }
.face-grid.mini.n3 { gap: 4px; padding: 6px; }
.face-grid.mini.n3 .cell { border-radius: 5px; }
.face-grid.mini.n3 .cell.center::after { width: 30%; }

/* Which edge touches green, on the top and bottom faces */
.face-grid.strip-bottom { padding-bottom: 17px; box-shadow: 0 7px 0 rgba(13, 14, 18, .22), inset 0 -14px 0 #1FAD5C; }
.face-grid.strip-top { padding-top: 17px; box-shadow: 0 7px 0 rgba(13, 14, 18, .22), inset 0 14px 0 #1FAD5C; }

/* Thinking */
.thinking { width: 54px; height: 54px; margin: 6px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; background: #0D0E12; border-radius: 12px; animation: think 1.1s cubic-bezier(.5, 0, .3, 1) infinite; }
.thinking i { border-radius: 4px; }
@keyframes think { 50% { transform: rotate(90deg); } 100% { transform: rotate(180deg); } }

/* Long solutions */
.bar { width: 132px; height: 12px; border-radius: 7px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 7px; }

.mini-stk.back { fill: #D5DAE4; }
@media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }

/* Camera button beside the grid */
.grid-row { position: relative; width: max-content; margin: 0 auto; }
.cam-btn {
  position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
  width: 58px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px; cursor: pointer;
  color: var(--ink); background: var(--paper); border: 3px solid var(--btn-border); border-radius: 16px;
  box-shadow: 0 4px 0 var(--frame); font: 600 13px/1 var(--display); touch-action: manipulation;
}
.cam-btn svg { width: 26px; height: 26px; }
.cam-btn:active { transform: translateY(calc(-50% + 3px)); box-shadow: 0 1px 0 var(--frame); }
.cell.unsure { outline: 3px dashed var(--coach); outline-offset: 2px; }
.face-grid.n3 .cell.unsure { outline-width: 2.5px; }
.unsure-note { margin: -4px auto 0; max-width: 32ch; font-size: 15px; color: var(--ink); }

/* Camera sheet (dark in both themes, like any camera) */
:root { --cam-bg: #0B0C10; --cam-ink: #F4F5F8; --cam-soft: #B9BFCC; }
body.cam-open { overflow: hidden; }
.cam {
  position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: var(--cam-bg); color: var(--cam-ink); text-align: center;
}
.cam-head h2 { margin: 0; font: 600 22px/1.15 var(--display); }
.cam-head p { margin: 4px auto 0; max-width: 34ch; font-size: 16px; color: var(--cam-soft); }
.cam-view {
  position: relative; flex: 1 1 auto; min-height: 220px; width: 100%; max-width: 560px; margin: 0 auto;
  border-radius: 18px; overflow: hidden; background: #000; touch-action: none;
}
.cam-view video, .cam-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-guide {
  position: absolute; display: grid; gap: 6px; padding: 6px; border-radius: 16px;
  border: 3px solid rgba(255, 255, 255, .95); box-shadow: 0 0 0 2px rgba(0, 0, 0, .55), 0 0 0 999px rgba(0, 0, 0, .28);
  pointer-events: none;
}
.cam-guide.n2 { grid-template-columns: repeat(2, 1fr); }
.cam-guide.n3 { grid-template-columns: repeat(3, 1fr); }
.cam-guide.strip-bottom { border-bottom: 10px solid #1FAD5C; }
.cam-guide.strip-top { border-top: 10px solid #1FAD5C; }
.g-cell { position: relative; border-radius: 10px; border: 1.5px dashed rgba(255, 255, 255, .45); display: grid; place-items: center; }
.g-center { border: 3px solid var(--expect); }
.g-cell i {
  width: 34%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #fff;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, .55); transition: background-color .15s ease;
}
.g-cell.empty i { border-style: dotted; opacity: .6; }
.g-cell.unsure i { border-style: dashed; border-color: var(--coach); }
.cam-msg {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; padding: 24px;
  background: rgba(11, 12, 16, .88); font-size: 17px;
}
.cam-msg[hidden] { display: none; }
.cam-msg p { margin: 0 auto; max-width: 28ch; }
.cam-msg .cam-small { color: var(--cam-soft); font-size: 15px; }
.cam-msg .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin: 6px auto 0; padding: 14px 22px; }
.cam-msg .btn svg { width: 24px; height: 24px; }
.cam-retake {
  position: absolute; right: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 7px 12px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, .8); background: rgba(11, 12, 16, .7);
  color: var(--cam-ink); font: 600 14px/1 var(--display);
}
.cam-retake svg { width: 18px; height: 18px; }
.pick { position: relative; overflow: hidden; cursor: pointer; }
.cam-retake.pick { position: absolute; }
.pick-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; font-size: 16px; }
.pick:focus-within { outline: 3px solid var(--coach); outline-offset: 3px; }

.cam-msg .picks .btn { min-width: 230px; margin: 0; }

.cam .actions { width: 100%; max-width: 560px; margin: 0 auto; }

</style>
</head>
<body>
<div class="app" id="app" data-screen="welcome">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i style="background:#1FAD5C"></i><i style="background:#FFD43B"></i><i style="background:#D7263D"></i><i style="background:#1F6FEB"></i></span>Cube Coach</div>
    <button class="restart" id="restart" type="button">Start over</button>
  </header>
  <div class="stage" id="stage" aria-hidden="true">
    <div class="floor"></div>
    <div class="scene" id="scene">
      <div class="spinner" id="spinner"><div class="cube" id="cube"></div></div>
    </div>
  </div>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>
<script>
(() => {
'use strict';
// ===== 2x2 cube core: model, deduction from 4 sides, validation, optimal solver =====
// Coordinates: x right, y up, z toward the viewer. Sticker index = cornerIndex * 3 + axis.
const POS = [];
for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) POS.push([x, y, z]);
const posIndex = (p) => POS.findIndex((q) => q[0] === p[0] && q[1] === p[1] && q[2] === p[2]);
const sIdx = (p, ax) => posIndex(p) * 3 + ax;

const ROT = {
  R: ([x, y, z]) => [x, z, -y],
  U: ([x, y, z]) => [-z, y, x],
  F: ([x, y, z]) => [y, -x, z],
};
const LAYER_AX = { R: 0, U: 1, F: 2 };

function basePerm(m) {
  const perm = Array.from({ length: 24 }, (_, i) => i);
  for (let i = 0; i < 24; i++) {
    const p = POS[Math.floor(i / 3)];
    const ax = i % 3;
    if (p[LAYER_AX[m]] !== 1) continue;
    const n = [0, 0, 0];
    n[ax] = p[ax];
    const np = ROT[m](p);
    const nn = ROT[m](n);
    const nax = nn.findIndex((v) => v !== 0);
    perm[sIdx(np, nax)] = i;
  }
  return perm;
}
const compose = (p, q) => q.map((j) => p[j]);
const PERMS = {};
for (const m of ['R', 'U', 'F']) {
  const p1 = basePerm(m);
  const p2 = compose(p1, p1);
  const p3 = compose(p2, p1);
  PERMS[m] = p1;
  PERMS[m + '2'] = p2;
  PERMS[m + "'"] = p3;
}
const MOVES = Object.keys(PERMS);
function applyMove(s, m) {
  const p = PERMS[m];
  let o = '';
  for (let j = 0; j < 24; j++) o += s[p[j]];
  return o;
}
const invMove = (m) => (m.length === 1 ? m + "'" : m[1] === "'" ? m[0] : m);

// Face cells in reading order TL, TR, BL, BR, as seen from outside.
// Side faces are seen with the top up; U is seen from above with F at the bottom;
// D is seen with the top tipped away, so F is at the top.
const FACE_CELLS = {
  F: [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([x, y]) => sIdx([x, y, 1], 2)),
  R: [[1, 1], [-1, 1], [1, -1], [-1, -1]].map(([z, y]) => sIdx([1, y, z], 0)),
  B: [[1, 1], [-1, 1], [1, -1], [-1, -1]].map(([x, y]) => sIdx([x, y, -1], 2)),
  L: [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([z, y]) => sIdx([-1, y, z], 0)),
  U: [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([x, z]) => sIdx([x, 1, z], 1)),
  D: [[-1, 1], [1, 1], [-1, -1], [1, -1]].map(([x, z]) => sIdx([x, -1, z], 1)),
};

const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
// For each corner: its sticker axes in clockwise order (seen from outside), starting with the up/down sticker.
const CW = POS.map((p) => {
  const second = dot(cross([0, p[1], 0], [p[0], 0, 0]), p) < 0 ? 0 : 2;
  return [1, second, second === 0 ? 2 : 0];
});

// Standard color scheme: white opposite yellow, green opposite blue, red opposite orange.
const COLORS = ['W', 'Y', 'R', 'O', 'B', 'G'];
const OPP = { W: 'Y', Y: 'W', G: 'B', B: 'G', R: 'O', O: 'R' };
const refFace = (ax, sign) =>
  ax === 1 ? (sign > 0 ? 'W' : 'Y') : ax === 2 ? (sign > 0 ? 'G' : 'B') : sign > 0 ? 'R' : 'O';
const REF_PIECES = POS.map((p, pi) => CW[pi].map((ax) => refFace(ax, p[ax])).join(''));

// Which faces the kid's sides 1-4 are: turning the cube left (as instructed) or right (common slip).
const SIDE_ORDERS = { left: ['F', 'R', 'B', 'L'], right: ['F', 'L', 'B', 'R'] };

// Sticker index -> { k: side number 0-3, c: cell 0-3 } for the instructed (left) order.
const CELL_OF = {};
SIDE_ORDERS.left.forEach((face, k) => FACE_CELLS[face].forEach((si, c) => { CELL_OF[si] = { k, c }; }));

// Deduce the whole cube from the 4 side faces. entry[k][c] = color letter.
function deduce(entry, order) {
  const s = new Array(24).fill(null);
  SIDE_ORDERS[order].forEach((face, k) => FACE_CELLS[face].forEach((si, c) => { s[si] = entry[k][c]; }));
  const pieces = [];
  let twist = 0;
  for (let pi = 0; pi < 8; pi++) {
    const axes = CW[pi];
    const k1 = s[pi * 3 + axes[1]];
    const k2 = s[pi * 3 + axes[2]];
    let found = null;
    for (const r of REF_PIECES) {
      for (let k = 0; k < 3; k++) {
        const rot = r.slice(k) + r.slice(0, k);
        if (rot[1] === k1 && rot[2] === k2) found = rot;
      }
    }
    if (!found) {
      return { ok: false, type: 'corner', cells: [pi * 3 + axes[1], pi * 3 + axes[2]], colors: [k1, k2] };
    }
    s[pi * 3 + axes[0]] = found[0];
    pieces.push({ pi, rot: found });
    twist += [...found].findIndex((c) => c === 'W' || c === 'Y');
  }
  const seen = {};
  for (const { pi, rot } of pieces) {
    const key = [...rot].sort().join('');
    if (seen[key] !== undefined) {
      const a = seen[key];
      return {
        ok: false, type: 'duplicate', colors: [...rot],
        cells: [a * 3 + CW[a][1], a * 3 + CW[a][2], pi * 3 + CW[pi][1], pi * 3 + CW[pi][2]],
      };
    }
    seen[key] = pi;
  }
  if (twist % 3 !== 0) return { ok: false, type: 'twist' };
  return { ok: true, state: s.join('') };
}

// Full check: instructed order first, then the "turned right by mistake" order,
// then look for a single square that, changed, makes everything fit.
function analyze(entry) {
  const a = deduce(entry, 'left');
  if (a.ok) return { ok: true, state: a.state, order: 'left' };
  const b = deduce(entry, 'right');
  if (b.ok) return { ok: true, state: b.state, order: 'right' };
  const fixes = [];
  for (let k = 0; k < 4; k++) {
    for (let c = 0; c < 4; c++) {
      for (const col of COLORS) {
        if (col === entry[k][c]) continue;
        const e2 = entry.map((r) => r.slice());
        e2[k][c] = col;
        if (deduce(e2, 'left').ok || deduce(e2, 'right').ok) fixes.push({ k, c, from: entry[k][c], to: col });
      }
    }
  }
  const error = { ...a };
  if (error.cells) error.where = error.cells.map((si) => CELL_OF[si]);
  return { ok: false, error, fixes };
}

// Solved state that keeps the back-bottom-left corner where it is (R, U, F never move it).
function goalFor(state) {
  const cL = state[0], cD = state[1], cB = state[2];
  let g = '';
  for (let i = 0; i < 24; i++) {
    const sign = POS[Math.floor(i / 3)][i % 3];
    const ax = i % 3;
    const base = ax === 0 ? cL : ax === 1 ? cD : cB;
    g += sign < 0 ? base : OPP[base];
  }
  return g;
}

// Optimal solution (fewest turns) with a two-sided breadth-first search.
function solve(start) {
  const goal = goalFor(start);
  if (start === goal) return [];
  const fwd = new Map([[start, null]]);
  const bwd = new Map([[goal, null]]);
  let ff = [start];
  let bf = [goal];
  const build = (t) => {
    const path = [];
    let s = t;
    while (fwd.get(s)) { const [p, m] = fwd.get(s); path.push(m); s = p; }
    path.reverse();
    s = t;
    while (bwd.get(s)) { const [p, m] = bwd.get(s); path.push(invMove(m)); s = p; }
    return path;
  };
  for (let depth = 0; depth < 16; depth++) {
    if (ff.length <= bf.length) {
      const nf = [];
      for (const s of ff) for (const m of MOVES) {
        const t = applyMove(s, m);
        if (!fwd.has(t)) { fwd.set(t, [s, m]); nf.push(t); if (bwd.has(t)) return build(t); }
      }
      ff = nf;
    } else {
      const nf = [];
      for (const s of bf) for (const m of MOVES) {
        const t = applyMove(s, m);
        if (!bwd.has(t)) { bwd.set(t, [s, m]); nf.push(t); if (fwd.has(t)) return build(t); }
      }
      bf = nf;
    }
  }
  return null;
}

const isSolved = (s) =>
  Object.values(FACE_CELLS).every((cells) => cells.every((i) => s[i] === s[cells[0]]));


// ===== 3x3 cube core =====
// Facelets in Kociemba order: U, R, F, D, L, B; each face read row by row as seen from outside
// (U with the back at the top, D with the front at the top, side faces with U at the top).
const FACES3 = ['U', 'R', 'F', 'D', 'L', 'B'];
const CENTER3 = { U: 'W', R: 'R', F: 'G', D: 'Y', L: 'O', B: 'B' };
function cell3(face, r, c) {
  switch (face) {
    case 'U': return { pos: [c - 1, 1, r - 1], n: [0, 1, 0] };
    case 'R': return { pos: [1, 1 - r, 1 - c], n: [1, 0, 0] };
    case 'F': return { pos: [c - 1, 1 - r, 1], n: [0, 0, 1] };
    case 'D': return { pos: [c - 1, -1, 1 - r], n: [0, -1, 0] };
    case 'L': return { pos: [-1, 1 - r, c - 1], n: [-1, 0, 0] };
    default: return { pos: [1 - c, 1 - r, -1], n: [0, 0, -1] };
  }
}
const F3 = [];
FACES3.forEach((face) => { for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) F3.push(cell3(face, r, c)); });
const key3 = (p, n) => p.join(',') + '|' + n.join(',');
const IDX3 = new Map(F3.map((s, i) => [key3(s.pos, s.n), i]));
const axisOf = (n) => n.findIndex((v) => v !== 0);

const ROT3 = {
  R: ([x, y, z]) => [x, z, -y],
  L: ([x, y, z]) => [x, -z, y],
  U: ([x, y, z]) => [-z, y, x],
  D: ([x, y, z]) => [z, y, -x],
  F: ([x, y, z]) => [y, -x, z],
  B: ([x, y, z]) => [-y, x, z],
};
const LAYER3 = { R: [0, 1], L: [0, -1], U: [1, 1], D: [1, -1], F: [2, 1], B: [2, -1] };
function perm3(m) {
  const [ax, sign] = LAYER3[m];
  const perm = Array.from({ length: 54 }, (_, i) => i);
  F3.forEach((s, i) => {
    if (s.pos[ax] !== sign) return;
    perm[IDX3.get(key3(ROT3[m](s.pos), ROT3[m](s.n)))] = i;
  });
  return perm;
}
const PERMS3 = {};
for (const m of FACES3) {
  const p1 = perm3(m), p2 = p1.map((j) => p1[j]), p3 = p1.map((j) => p2[j]);
  PERMS3[m] = p1; PERMS3[m + '2'] = p2; PERMS3[m + "'"] = p3;
}
function applyMove3(s, m) {
  const p = PERMS3[m];
  let o = '';
  for (let j = 0; j < 54; j++) o += s[p[j]];
  return o;
}
const SOLVED3 = FACES3.map((f) => CENTER3[f].repeat(9)).join('');

// Pieces: corners (stickers clockwise from the up/down sticker) and edges (main sticker first).
const PIECES3 = (() => {
  const groups = new Map();
  F3.forEach((s, i) => {
    const k = s.pos.join(',');
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  });
  const corners = [], edges = [];
  for (const [k, idxs] of groups) {
    const pos = k.split(',').map(Number);
    const byAx = {};
    idxs.forEach((i) => { byAx[axisOf(F3[i].n)] = i; });
    const nz = pos.filter((v) => v !== 0).length;
    if (nz === 3) {
      const second = dot(cross([0, pos[1], 0], [pos[0], 0, 0]), pos) < 0 ? 0 : 2;
      corners.push([byAx[1], byAx[second], byAx[second === 0 ? 2 : 0]]);
    } else if (nz === 2) {
      edges.push(byAx[1] !== undefined ? [byAx[1], byAx[0] !== undefined ? byAx[0] : byAx[2]] : [byAx[2], byAx[0]]);
    }
  }
  return { corners, edges };
})();
const REF_C = PIECES3.corners.map((ix) => ix.map((i) => SOLVED3[i]).join(''));
const REF_E = PIECES3.edges.map((ix) => ix.map((i) => SOLVED3[i]).join(''));

function permParity(perm) {
  const seen = new Array(perm.length).fill(false);
  let p = 0;
  for (let i = 0; i < perm.length; i++) {
    if (seen[i]) continue;
    let j = i, len = 0;
    while (!seen[j]) { seen[j] = true; j = perm[j]; len++; }
    p += len - 1;
  }
  return p % 2;
}

// Is this a real, solvable 3x3 state? Returns the stickers involved when it isn't.
function validate3(s) {
  for (let f = 0; f < 6; f++) if (s[f * 9 + 4] !== CENTER3[FACES3[f]]) return { ok: false, type: 'centers' };
  const cPerm = [], ePerm = [], seenC = {}, seenE = {};
  let twist = 0, flip = 0;
  for (let k = 0; k < 8; k++) {
    const ix = PIECES3.corners[k];
    const cols = ix.map((i) => s[i]).join('');
    let found = -1;
    for (let p = 0; p < 8 && found < 0; p++) {
      const r = REF_C[p];
      for (let t = 0; t < 3; t++) if (r.slice(t) + r.slice(0, t) === cols) { found = p; break; }
    }
    if (found < 0) return { ok: false, type: 'piece', idxs: ix };
    if (seenC[found] !== undefined) return { ok: false, type: 'duplicate', idxs: [...PIECES3.corners[seenC[found]], ...ix] };
    seenC[found] = k;
    cPerm.push(found);
    twist += [...cols].findIndex((c) => c === 'W' || c === 'Y');
  }
  for (let k = 0; k < 12; k++) {
    const ix = PIECES3.edges[k];
    const a = s[ix[0]], b = s[ix[1]];
    let found = -1, fl = 0;
    for (let p = 0; p < 12; p++) {
      if (REF_E[p] === a + b) { found = p; fl = 0; break; }
      if (REF_E[p] === b + a) { found = p; fl = 1; break; }
    }
    if (found < 0) return { ok: false, type: 'piece', idxs: ix };
    if (seenE[found] !== undefined) return { ok: false, type: 'duplicate', idxs: [...PIECES3.edges[seenE[found]], ...ix] };
    seenE[found] = k;
    ePerm.push(found);
    flip += fl;
  }
  if (twist % 3 !== 0) return { ok: false, type: 'twist' };
  if (flip % 2 !== 0) return { ok: false, type: 'flip' };
  if (permParity(cPerm) !== permParity(ePerm)) return { ok: false, type: 'parity' };
  return { ok: true };
}

// The kid copies faces in this order, guided by the center colors.
const STEPS3 = ['F', 'R', 'B', 'L', 'U', 'D'];
const ROT_GRID = [
  [0, 1, 2, 3, 4, 5, 6, 7, 8],
  [6, 3, 0, 7, 4, 1, 8, 5, 2],
  [8, 7, 6, 5, 4, 3, 2, 1, 0],
  [2, 5, 8, 1, 4, 7, 0, 3, 6],
];
// entry[k] = 9 colors of face STEPS3[k], as the kid saw it. rots[k] = quarter turns to apply.
function build3(entry, rots) {
  const s = new Array(54);
  STEPS3.forEach((face, k) => {
    const f = FACES3.indexOf(face);
    const rot = ROT_GRID[rots ? rots[k] : 0];
    for (let i = 0; i < 9; i++) s[f * 9 + i] = entry[k][rot[i]];
  });
  return s.join('');
}
// Sticker index -> { k: step, c: cell } as the kid entered it.
const CELL3_OF = {};
STEPS3.forEach((face, k) => { const f = FACES3.indexOf(face); for (let c = 0; c < 9; c++) CELL3_OF[f * 9 + c] = { k, c }; });

function analyze3(entry) {
  const s = build3(entry);
  const v = validate3(s);
  if (v.ok) return { ok: true, state: s, turned: [] };
  // A face copied while held the wrong way round? Try every combination of quarter turns of the
  // copied faces. Hits are counted by cube, not by combination (turning a solid face changes
  // nothing), and the cube reached with the fewest turned faces wins unless two cubes tie
  // (a nearly solved cube also reads as another valid cube with all four sides turned 180).
  const hits = new Map();
  for (let code = 1; code < 4096; code++) {
    const rots = [0, 1, 2, 3, 4, 5].map((k) => (code >> (2 * k)) & 3);
    const t = build3(entry, rots);
    if (!validate3(t).ok) continue;
    const n = rots.filter(Boolean).length, h = hits.get(t);
    if (!h || n < h.n) hits.set(t, { rots, n });
  }
  const best = [...hits.entries()].sort((a, b) => a[1].n - b[1].n);
  if (best.length === 1 || (best.length > 1 && best[0][1].n < best[1][1].n)) {
    const [state, { rots }] = best[0];
    return { ok: true, state, turned: rots.map((r, k) => (r ? k : -1)).filter((k) => k >= 0) };
  }
  // A single square copied wrong?
  const fixes = [];
  for (let k = 0; k < 6; k++) {
    for (let c = 0; c < 9; c++) {
      if (c === 4) continue;
      for (const col of ['W', 'Y', 'R', 'O', 'B', 'G']) {
        if (col === entry[k][c]) continue;
        const e2 = entry.map((r) => r.slice());
        e2[k][c] = col;
        if (validate3(build3(e2)).ok) fixes.push({ k, c, from: entry[k][c], to: col });
      }
    }
  }
  const error = { ...v };
  if (error.idxs) error.where = error.idxs.map((i) => CELL3_OF[i]);
  return { ok: false, error, fixes };
}

// cubejs wants face letters, not colors.
const COLOR_TO_FACE = { W: 'U', R: 'R', G: 'F', Y: 'D', O: 'L', B: 'B' };
const toFaceletString = (s) => [...s].map((c) => COLOR_TO_FACE[c]).join('');
const isSolved3 = (s) => FACES3.every((_, f) => s.slice(f * 9, f * 9 + 9).split('').every((c) => c === s[f * 9 + 4]));


// ===== Reading sticker colors from camera pixels =====
// px: RGBA bytes (canvas ImageData layout), w x h. All work stays on the device.
function hsvOf(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d > 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, max === 0 ? 0 : d / max, max / 255];
}
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

function bandOf(h, bounds) {
  // bounds: { RO, OY } can move with what the camera saw on known middles
  const ro = bounds.RO, oy = bounds.OY;
  if (h >= 345 || h < ro) return 'R';
  if (h < oy) return 'O';
  if (h < 72) return 'Y';
  if (h < 175) return 'G';
  if (h < 265) return 'B';
  return h >= 300 ? 'R' : 'B';
}

// Read one square. Black plastic is ignored. Shiny spots wash colors out, so the square's
// color is judged from its most vivid quarter of pixels, which glare rarely covers.
function readPatch(px, w, x0, y0, x1, y1) {
  const all = [];
  const step = Math.max(1, Math.floor((x1 - x0) / 28));
  for (let y = y0; y < y1; y += step) {
    for (let x = x0; x < x1; x += step) {
      const i = (y * w + x) * 4;
      all.push(hsvOf(px[i], px[i + 1], px[i + 2]));
    }
  }
  const total = all.length;
  let top = 0;
  for (const p of all) if (p[2] > top) top = p[2];
  const floor = Math.max(0.16, top * 0.4);
  const pts = all.filter((p) => p[2] >= floor);
  pts.sort((a, b) => b[1] - a[1]);
  const vivid = pts.slice(0, Math.max(1, Math.ceil(pts.length * 0.25)));
  let sx = 0, sy = 0, sw = 0;
  for (const [h, s] of vivid) {
    const a = h * Math.PI / 180;
    sx += Math.cos(a) * s; sy += Math.sin(a) * s; sw += s;
  }

  if (hue < 0) hue += 360;

    for (const s of Object.values(stk)) if (!el._stk.includes(s)) s.style.display = 'none';

  });

    a.style.width = a.style.height = (2 * H) + 'px';
    a.style.left = a.style.top = (-H) + 'px';
    a.style.transform = tf;

  arrowFront = plane(`translateZ(${H + 3}px)`);
  arrowTop = plane(`rotateX(90deg) translateZ(${H + 3}px)`);

}
function useModel(n) {
  if (model.N === n && cubies.length) return;
  model = MODEL[n];
  shown = [];

}

function paint(display) {
  shown = Array.from(display);
  for (let i = 0; i < shown.length; i++) {
    const [ci, ax] = model.slot(i);
    const st = cubies[ci] && cubies[ci]._stk[ax];

const VIEW = { input: [-16, 24], top: [-62, -22], bottom: [60, -22], solve: [-27, -37] };
let orient = { vx: -27, vy: -37, ax: 0, ay: 0 };
const cubeTf = (o) => `rotateX(${o.vx}deg) rotateY(${o.vy}deg) rotateX(${o.ax}deg) rotateY(${o.ay}deg)`;
const view = (name, ay = 0, ax = 0) => ({ vx: VIEW[name][0], vy: VIEW[name][1], ax, ay });
let orientTimer = null;
function setOrient(o, animate = true) {
  clearTimeout(orientTimer);
  if (animate && !reduced) {
    const d = ((((o.ay - orient.ay) % 360) + 540) % 360) - 180;
    const fromAy = o.ay - d;
    if (fromAy !== orient.ay) {
      cubeEl.style.transition = 'none';
      cubeEl.style.transform = cubeTf({ ...orient, ay: fromAy });
      void cubeEl.offsetWidth;
      cubeEl.style.transition = '';
    }
    orient = { ...o };
    cubeEl.style.transform = cubeTf(orient);
  } else {
    cubeEl.style.transition = 'none';
    orient = { ...o };
    cubeEl.style.transform = cubeTf(orient);
    void cubeEl.offsetWidth;
    cubeEl.style.transition = '';
  }
}
// Two moves in a row, e.g. turn back to the front and then tip the cube.
function setOrientThen(first, second, still) {
  if (reduced) { setOrient(second, false); return; }
  setOrient(first, true);
  orientTimer = setTimeout(() => { if (still()) setOrient(second, true); }, 1250);
}

const TURN = { R: [[1, 0, 0], 90], L: [[1, 0, 0], -90], U: [[0, 1, 0], -90], D: [[0, 1, 0], 90], F: [[0, 0, 1], 90], B: [[0, 0, 1], -90] };
let live = [];
function turn(move, ms) {
  const [axis, base] = TURN[move[0]];
  const amount = move.length === 1 ? 1 : move[1] === '2' ? 2 : -1;
  const [lax, sign] = model.layer[move[0]];
  const anims = [];
  cubies.forEach((el, ci) => {
    if (model.positions[ci][lax] !== sign) return;
    const b = cubieTf(ci);
    anims.push(el.animate([
      { transform: `rotate3d(${axis}, 0deg) ${b}` },
      { transform: `rotate3d(${axis}, ${base * amount}deg) ${b}` },
    ], { duration: ms, easing: 'cubic-bezier(.45, .05, .3, 1)', fill: 'forwards' }));
  });

  return anims;
}
function clearTurns() { live.forEach((a) => a.cancel()); live = []; }

let loopId = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function showArrow(on) { [arrowFront, arrowTop].forEach((a) => a && a.classList.toggle('hide', !on)); }
function stopLoops() {
  loopId++;
  clearTurns();
  sceneEl.classList.remove('fade');
  showArrow(false);
}
async function playTurn(move, ms, alive) {
  const anims = turn(move, ms);
  try { await Promise.all(anims.map((a) => a.finished)); } catch (e) { return false; }
  return alive();
}
async function moveLoop(before, move) {
  const id = ++loopId;
  const alive = () => id === loopId;
  const after = model.apply(before, move);
  const ms = move[1] === '2' ? 2300 : 1500;
  paint(before);
  drawArrow(move);
  while (alive()) {
    showArrow(true);
    await sleep(1400); if (!alive()) return;
    showArrow(false);
    if (!(await playTurn(move, ms, alive))) return;
    paint(after); clearTurns();
    await sleep(1600); if (!alive()) return;
    sceneEl.classList.add('fade');
    await sleep(260); if (!alive()) return;
    paint(before);
    sceneEl.classList.remove('fade');
    await sleep(320);
  }
}
function randomTurns(n) {
  const seq = [];
  while (seq.length < n) {
    const m = model.moves[Math.floor(Math.random() * model.moves.length)];
    if (seq.length && seq[seq.length - 1][0] === m[0]) continue;
    seq.push(m);
  }
  return seq;
}
async function demoLoop() {
  const id = ++loopId;
  const alive = () => id === loopId;
  let st = model.solved;
  paint(st);
  if (reduced) return;
  await sleep(900);
  const run = async (moves) => {
    for (const m of moves) {
      if (!(await playTurn(m, 480, alive))) return false;
      st = model.apply(st, m); paint(st); clearTurns();
      await sleep(120); if (!alive()) return false;
    }
    return true;
  };
  while (alive()) {
    const seq = randomTurns(5);
    if (!(await run(seq))) return;
    await sleep(900); if (!alive()) return;
    if (!(await run(seq.slice().reverse().map(invMove)))) return;
    await sleep(1800); if (!alive()) return;
  }
}

// ===== Turn arrows (drawn on the front face, or on the top face for back turns) =====
function arrowParts(move, N) {
  const f = move[0];
  const kind = move.length === 1 ? 1 : move[1] === '2' ? 2 : -1;
  const fwd = kind !== -1;
  const lo = N === 2 ? 50 : 34, hi = 200 - lo;
  const head = (x, y, dx, dy) => {
    const L = 44, W = 29, bx = x - dx * L, by = y - dy * L, nx = -dy, ny = dx;
    return [[x, y], [bx + nx * W, by + ny * W], [bx - nx * W, by - ny * W]].map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ');
  };
  const vert = (x, up) => (up
    ? { shaft: `M${x} 178 L${x} 64`, tip: head(x, 18, 0, -1) }
    : { shaft: `M${x} 22 L${x} 136`, tip: head(x, 182, 0, 1) });
  const horiz = (y, left) => (left
    ? { shaft: `M178 ${y} L64 ${y}`, tip: head(18, y, -1, 0) }
    : { shaft: `M22 ${y} L136 ${y}`, tip: head(182, y, 1, 0) });
  const arc = (cw, r) => {
    const rad = (a) => a * Math.PI / 180;
    const P = (a) => [100 + r * Math.cos(rad(a)), 100 + r * Math.sin(rad(a))];
    const a0 = cw ? 200 : -20, a1 = cw ? 470 : -290, aEnd = cw ? a1 - 32 : a1 + 32;
    const [x0, y0] = P(a0), [x1, y1] = P(aEnd), [xt, yt] = P(a1);
    const dx = cw ? -Math.sin(rad(a1)) : Math.sin(rad(a1));
    const dy = cw ? Math.cos(rad(a1)) : -Math.cos(rad(a1));
    return { shaft: `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 1 ${cw ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}`, tip: head(xt, yt, dx, dy) };
  };
  let a, plane = 'front';
  if (f === 'R') a = vert(hi, fwd);
  else if (f === 'L') a = vert(lo, !fwd);
  else if (f === 'U') a = horiz(lo, fwd);
  else if (f === 'D') a = horiz(hi, !fwd);
  else if (f === 'B') { a = horiz(lo, fwd); plane = 'top'; }
  else a = arc(fwd, N === 2 ? 58 : 62);
  return { ...a, plane, twice: kind === 2 };
}
function arrowSVG(move, N, withFace) {
  const a = arrowParts(move, N);
  let face = '';
  if (withFace) {
    face = '<rect x="4" y="4" width="192" height="192" rx="30" fill="#0D0E12"/>';
    const gap = N === 2 ? 12 : 9, cell = (192 - gap * (N + 1)) / N;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = 4 + gap + c * (cell + gap), y = 4 + gap + r * (cell + gap);
        face += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cell.toFixed(1)}" height="${cell.toFixed(1)}" rx="${N === 2 ? 14 : 10}" class="mini-stk${a.plane === 'top' && r === 0 ? ' back' : ''}"/>`;
      }
    }
  }
  return `<svg viewBox="0 0 200 200" aria-hidden="true" focusable="false">${face}` +
    `<path d="${a.shaft}" class="a-out"/><polygon points="${a.tip}" class="a-out-h"/>` +
    `<path d="${a.shaft}" class="a-mid"/><polygon points="${a.tip}" class="a-mid-h"/>` +
    `<path d="${a.shaft}" class="a-core"/><polygon points="${a.tip}" class="a-core-h"/>` +
    (a.twice ? '<circle cx="100" cy="100" r="26" class="a-badge"/><text x="100" y="110" text-anchor="middle" class="a-badge-t">2×</text>' : '') +
    '</svg>';
}
function drawArrow(move) {
  const top = arrowParts(move, model.N).plane === 'top';
  arrowFront.innerHTML = top ? '' : arrowSVG(move, model.N, false);
  arrowTop.innerHTML = top ? arrowSVG(move, model.N, false) : '';
}

// ===== The 3x3 solver loads only when someone picks a 3x3 =====
let solverLoad = null, solverInit = null;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}
function preloadSolver() {
  if (!solverLoad) {
    solverLoad = (async () => { for (const src of SOLVER_URLS) await loadScript(src); })();
    solverLoad.catch(() => { solverLoad = null; });
  }
  return solverLoad;
}
// One init shared by overlapping solving screens (a resize mid-download renders the screen twice).
function ensureSolver() {
  if (!solverInit) {
    solverInit = (async () => { await preloadSolver(); await sleep(60); window.Cube.initSolver(); })();
    solverInit.catch(() => { solverInit = null; });
  }
  return solverInit;
}

// ===== Saving progress on this device =====
const KEY = 'cube-coach-v2';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      screen: app.screen, cube: app.cube, side: app.side, mode: app.mode, entry: app.entry, entry3: app.entry3,
      move: app.move, flags: app.flags, unsure: app.unsure, note: app.note,
      state: app.analysis && app.analysis.ok ? app.analysis.state : null, solution: app.solution,
    }));
  } catch (e) { /* storage unavailable */ }
}
function restore() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; }
  if (!d) return;
  const okColor = (c) => c === null || PALETTE.includes(c);
  const okRows = (rows, n, len) => Array.isArray(rows) && rows.length === n && rows.every((r) => Array.isArray(r) && r.length === len && r.every(okColor));
  if (!okRows(d.entry, 4, 4) || !okRows(d.entry3, 6, 9)) return;
  if (!d.entry3.every((r, k) => r[4] === CENTER3[STEPS3[k]])) return;
  app.cube = d.cube === 3 ? 3 : 2;
  app.entry = d.entry;
  app.entry3 = d.entry3;
  app.side = Math.min(sideCount() - 1, Math.max(0, d.side | 0));
  app.mode = ['first', 'review', 'fix'].includes(d.mode) ? d.mode : 'first';
  app.flags = Array.isArray(d.flags) ? d.flags.filter((f) => f && Number.isInteger(f.k) && Number.isInteger(f.c)) : [];
  app.note = typeof d.note === 'string' ? d.note : '';
  app.unsure = Array.isArray(d.unsure) ? d.unsure.filter((f) => f && Number.isInteger(f.k) && Number.isInteger(f.c)) : [];
  const m = MODEL[app.cube];
  const sol = Array.isArray(d.solution) ? d.solution.filter((x) => typeof x === 'string' && x in MOVE_TEXT) : null;
  const solves = (st, moves) => {
    if (typeof st !== 'string' || st.length !== m.size || !moves) return false;
    let x = st;
    for (const mv of moves) { if (!(mv in (is3() ? PERMS3 : PERMS))) return false; x = m.apply(x, mv); }
    return is3() ? isSolved3(x) : isSolved(x);
  };
  if (['hold', 'move', 'done'].includes(d.screen) && solves(d.state, sol)) {
    app.analysis = { ok: true, state: d.state, order: 'left', turned: [] };
    app.solution = sol;
    app.move = Math.min(Math.max(0, d.move | 0), Math.max(0, sol.length - 1));
    app.screen = d.screen === 'move' && !sol.length ? 'hold' : d.screen;
    return;
  }
  const full = entryNow().every((r) => r.every((c) => c));
  if (['checkTop', 'checkBottom', 'mismatch', 'oops', 'solving', 'solverError', 'hold', 'move', 'done'].includes(d.screen) && full) {
    if (is3()) {
      const r = analyze3(app.entry3);
      app.analysis = r;
      app.screen = r.ok ? 'solving' : 'oops';
    } else {
      const r = analyze(app.entry);
      app.analysis = r;
      if (r.ok) { app.solution = solve(r.state) || []; app.screen = ['mismatch', 'checkBottom'].includes(d.screen) ? d.screen : 'checkTop'; }
      else app.screen = 'oops';
    }
    return;
  }
  if (d.screen === 'side' || full) app.screen = 'side';
}

};

function refreshSide(popped) {
  const k = app.side, row = entryNow()[k], limit = is3() ? 9 : 4;
  const names = is3()
    ? ['sqTopLeft', 'sqTopMiddle', 'sqTopRight', 'sqMiddleLeft', 'sqMiddle', 'sqMiddleRight', 'sqBottomLeft', 'sqBottomMiddle', 'sqBottomRight']
    : ['sqTopLeft', 'sqTopRight', 'sqBottomLeft', 'sqBottomRight'];
  panelEl.querySelectorAll('button.cell').forEach((cell) => {
    const c = Number(cell.dataset.c), col = row[c];
    if (col) cell.style.setProperty('--c', HEX[col]); else cell.style.removeProperty('--c');
    cell.textContent = col ? '' : '?';
    cell.setAttribute('aria-label', t('squareLabel', { square: t(names[c]), state: col ? colorName(col) : t('notSet') }));
    cell.classList.toggle('flag', app.flags.some((f) => f.k === k && f.c === c));
    cell.classList.toggle('unsure', !!col && app.unsure.some((f) => f.k === k && f.c === c));
    if (c === popped) { cell.classList.remove('pop'); void cell.offsetWidth; cell.classList.add('pop'); }
  });
  const counts = {};
  entryNow().flat().forEach((c) => { if (c) counts[c] = (counts[c] || 0) + 1; });
  let over = null;
  panelEl.querySelectorAll('.sw').forEach((sw) => {
    const col = sw.dataset.col, n = counts[col] || 0;
    sw.setAttribute('aria-pressed', String(col === app.selected));
    let badge = sw.querySelector('.over');
    if (n > limit) {
      if (!badge) { badge = document.createElement('span'); badge.className = 'over'; sw.appendChild(badge); }
      badge.textContent = n;
      over = over || [col, n];
    } else if (badge) badge.remove();
  });
  const warn = document.getElementById('warn');
  if (warn) {
    warn.hidden = !over;
    if (over) warn.innerHTML = t('tooMany', { n: limit, have: over[1], color: over[0] });
  }
  const note = document.getElementById('unsure-note');
  if (note) note.hidden = !app.unsure.some((f) => f.k === k);
  const next = document.getElementById('next') || document.getElementById('check');
  if (next) next.disabled = row.some((c) => !c);
  paint(sideDisplay());
}

// ===== Copy a side with the camera =====
// Live camera when the page may use it; otherwise the phone's own camera through a photo.
// Pictures are read right here on the device and never leave it.
const CAM_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8.5 5.5 9.8 3.8c.3-.4.7-.6 1.2-.6h2c.5 0 .9.2 1.2.6l1.3 1.7H19a2.5 2.5 0 0 1 2.5 2.5v9A2.5 2.5 0 0 1 19 19.5H5A2.5 2.5 0 0 1 2.5 17V8A2.5 2.5 0 0 1 5 5.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="12.4" r="3.7" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>';
const camRefs = {};
let liveBlocked = false;
const cam = { el: null, mode: null, stream: null, video: null, photo: null, canvas: null, ctx: null, raf: 0, last: 0, hist: [], reads: null, pan: { x: 0, y: 0 }, zoom: 1, place: null, guide: null, dpr: 1, pointers: new Map(), dirty: false };
const work = document.createElement('canvas');
const workCtx = work.getContext('2d', { willReadFrequently: true });

function camText(k) {

function openCamera() {

  const strip = is3() && k === 4 ? ' strip-bottom' : is3() && k === 5 ? ' strip-top' : '';
  el.innerHTML = `
    <div class="cam-head"><h2 id="cam-title">${title}</h2><p>${hint}</p></div>
    <div class="cam-view" id="cam-view">

      <canvas id="cam-canvas" hidden></canvas>
      <div class="cam-guide n${N}${strip}" id="cam-guide" aria-hidden="true">${Array.from({ length: N * N }, (_, c) =>
        `<span class="g-cell${is3() && c === 4 ? ' g-center' : ''}" ${is3() && c === 4 ? `style="--expect:${center}"` : ''}><i></i></span>`).join('')}</div>

    </div>

    <div class="cam-actions">

      <button class="btn primary wide" id="cam-use" type="button" disabled>${t('useColors')}</button>
    </div>`;
  document.body.appendChild(el);

  cam.el = el;
  cam.mode = null;
  cam.hist = [];
  cam.reads = null;
  cam.canvas = el.querySelector('#cam-canvas');

  cam.video = el.querySelector('#cam-video');
  el.querySelector('#cam-cancel').addEventListener('click', closeCamera);
  el.querySelector('#cam-use').addEventListener('click', useReadings);
  // Photos come in through real file inputs laid over the photo buttons. A tap lands on the
  // input itself, which phones honor even where a script-triggered click is ignored.
  el.addEventListener('change', (e) => {
    if (!e.target.classList.contains('pick-input')) return;
    const f = e.target.files && e.target.files[0];
    e.target.value = '';

  });
  el.addEventListener('click', (e) => {
    if (!e.target.classList || !e.target.classList.contains('pick-input')) return;
    clearTimeout(cam.pickTimer);
    let left = false;
    const away = () => { left = true; };
    window.addEventListener('blur', away, { once: true });
    document.addEventListener('visibilitychange', away, { once: true });
    cam.pickTimer = setTimeout(() => {
      window.removeEventListener('blur', away);
      document.removeEventListener('visibilitychange', away);

      }

  });
  const view = el.querySelector('#cam-view');
  view.addEventListener('pointerdown', onPointerDown);
  view.addEventListener('pointermove', onPointerMove);

  el.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCamera(); });
  layoutCam();
  el.querySelector('#cam-cancel').focus();
  if (!liveBlocked && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startLive();
  else askForPhoto(t('camBlocked'));
}

function closeCamera() {
  clearTimeout(cam.pickTimer);
  cancelAnimationFrame(cam.raf);
  cam.raf = 0;
  if (cam.stream) cam.stream.getTracks().forEach((t) => t.stop());
  cam.stream = null;
  cam.photo = null;
  cam.pointers.clear();
  if (cam.el) cam.el.remove();
  cam.el = null;
  document.body.classList.remove('cam-open');
}

function setMsg(html) {
  const m = cam.el && cam.el.querySelector('#cam-msg');
  if (!m) return;
  m.hidden = !html;
  m.innerHTML = html || '';
  cam.el.querySelector('#cam-guide').style.visibility = html ? 'hidden' : '';
}
function setTip(text) { const t = cam.el && cam.el.querySelector('#cam-tip'); if (t) t.textContent = text; }

function layoutCam() {
  if (!cam.el) return;
  const view = cam.el.querySelector('#cam-view');
  const r = view.getBoundingClientRect();
  const size = Math.round(Math.min(r.width, r.height) * 0.74);
  cam.guide = { x: (r.width - size) / 2, y: (r.height - size) / 2, size, vw: r.width, vh: r.height };
  const g = cam.el.querySelector('#cam-guide');
  Object.assign(g.style, { left: cam.guide.x + 'px', top: cam.guide.y + 'px', width: size + 'px', height: size + 'px' });
  cam.dpr = Math.min(2, window.devicePixelRatio || 1);
  cam.canvas.width = Math.round(r.width * cam.dpr);
  cam.canvas.height = Math.round(r.height * cam.dpr);
  if (cam.mode === 'photo') drawPhoto();
}

async function startLive() {
  const el = cam.el; // the sheet this request belongs to; a cancelled sheet's camera must not leak
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } } });
    if (cam.el !== el) { stream.getTracks().forEach((t) => t.stop()); return; }
    cam.stream = stream;
    cam.video.srcObject = stream;
    cam.video.hidden = false;
    await cam.video.play();
    cam.mode = 'live';
    setMsg('');
    tick();
  } catch (e) {
    if (cam.el !== el) return;
    if (cam.stream) cam.stream.getTracks().forEach((t) => t.stop());
    cam.stream = null;
    const denied = e && e.name === 'NotAllowedError';
    liveBlocked = denied; // a busy or missing camera is worth another try on the next side
    cam.video.hidden = true;
    askForPhoto(denied ? t('camNotAllowed') : t('camFailed'));
  }
}

function pickHTML(label, cls, capture) {
  const name = label.replace(/<[^>]*>/g, '');
  return `<label class="pick ${cls}">${label}<input class="pick-input" type="file" accept="image/*"${capture ? ' capture="environment"' : ''} aria-label="${name}"></label>`;
}

function askForPhoto(why) {
  cam.mode = 'ask';
  setMsg(`<p>${why}</p><p class="cam-small">${t('camGetClose')}</p>` +
    `<div class="picks">${pickHTML(CAM_ICON + t('takePhoto'), 'btn primary', true)}${pickHTML(t('choosePhoto'), 'btn', false)}</div>`);
  setTip(t('camTipPhoto'));
}

async function decodePhoto(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* try plain */ }
  try { return await createImageBitmap(file); } catch (e) { /* try an image element */ }
  const url = await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
  const img = new Image();
  img.src = url;
  await img.decode();
  return img;
}

async function loadPhoto(file) {
  setMsg(`<p>${t('camReading')}</p>`);
  let src;
  try { src = await decodePhoto(file); } catch (e) { askForPhoto(t('camBadPhoto')); return; }
  if (!cam.el) return;
  const iw = src.width || src.naturalWidth, ih = src.height || src.naturalHeight;
  const k = Math.min(1, 1600 / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.round(iw * k);
  c.height = Math.round(ih * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  cam.photo = c;
  cam.mode = 'photo';
  cam.hist = [];
  cam.canvas.hidden = false;
  setMsg('');
  // Start with the cube where it most likely is.
  const small = document.createElement('canvas');
  const sk = Math.min(1, 600 / Math.max(c.width, c.height));
  small.width = Math.round(c.width * sk);
  small.height = Math.round(c.height * sk);
  const sctx = small.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(c, 0, 0, small.width, small.height);
  const box = findFace(sctx.getImageData(0, 0, small.width, small.height).data, small.width, small.height);
  fitBox({ x: box.x / sk, y: box.y / sk, size: box.size / sk });
  setTip(t('camTipFit'));
  addRetake();
  drawPhoto();
  readNow();
}

function addRetake() {
  if (cam.el.querySelector('.cam-retake')) return;
  const b = document.createElement('label');
  b.className = 'cam-retake pick';
  b.innerHTML = `${CAM_ICON}<span>${t('retake')}</span><input class="pick-input" type="file" accept="image/*" capture="environment" aria-label="${t('retakeAria')}">`;
  cam.el.querySelector('#cam-view').appendChild(b);
}

function baseScale() { return Math.max(cam.canvas.width / cam.photo.width, cam.canvas.height / cam.photo.height); }
function fitBox(box) {
  const g = cam.guide, d = cam.dpr, base = baseScale();
  const s = Math.min(base * 6, Math.max(base * 0.4, (g.size * d) / box.size));
  cam.zoom = s / base;
  const dw = cam.photo.width * s, dh = cam.photo.height * s;
  const ox = (g.x + g.size / 2) * d - (box.x + box.size / 2) * s;
  const oy = (g.y + g.size / 2) * d - (box.y + box.size / 2) * s;
  cam.pan = { x: (ox - (cam.canvas.width - dw) / 2) / d, y: (oy - (cam.canvas.height - dh) / 2) / d };
}
function drawPhoto() {
  if (!cam.photo) return;
  const cw = cam.canvas.width, ch = cam.canvas.height, s = baseScale() * cam.zoom;
  const dw = cam.photo.width * s, dh = cam.photo.height * s;
  const ox = (cw - dw) / 2 + cam.pan.x * cam.dpr, oy = (ch - dh) / 2 + cam.pan.y * cam.dpr;
  cam.ctx.fillStyle = '#000';
  cam.ctx.fillRect(0, 0, cw, ch);
  cam.ctx.drawImage(cam.photo, ox, oy, dw, dh);
  cam.place = { s, ox, oy };
}

function onPointerDown(e) {
  if (cam.mode !== 'photo' || (e.target.closest && e.target.closest('.pick'))) return;
  e.currentTarget.setPointerCapture(e.pointerId);
  cam.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
}
function onPointerMove(e) {
  if (cam.mode !== 'photo' || !cam.pointers.has(e.pointerId)) return;
  const prev = cam.pointers.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
  if (cam.pointers.size === 1) {
    cam.pan.x += cur.x - prev.x;
    cam.pan.y += cur.y - prev.y;
  } else {
    const other = [...cam.pointers.entries()].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(cur.x - other.x, cur.y - other.y);
    if (d0 > 10) {
      const z = Math.min(6, Math.max(0.4, cam.zoom * (d1 / d0)));
      const f = z / cam.zoom;
      cam.pan.x *= f; cam.pan.y *= f;
      cam.zoom = z;
    }
  }
  cam.pointers.set(e.pointerId, cur);
  if (!cam.dirty) {
    cam.dirty = true;
    requestAnimationFrame(() => { cam.dirty = false; drawPhoto(); readNow(); });
  }
}
function onPointerUp(e) { cam.pointers.delete(e.pointerId); }

// Where the guide square sits in the picture's own pixels.
function guideInSource() {
  const g = cam.guide;
  if (cam.mode === 'live') {
    const iw = cam.video.videoWidth, ih = cam.video.videoHeight;
    if (!iw || !ih) return null;
    const s = Math.max(g.vw / iw, g.vh / ih);
    const ox = (g.vw - iw * s) / 2, oy = (g.vh - ih * s) / 2;
    return { src: cam.video, x: (g.x - ox) / s, y: (g.y - oy) / s, size: g.size / s };
  }
  if (cam.mode === 'photo' && cam.place) {
    const d = cam.dpr, p = cam.place;
    return { src: cam.photo, x: (g.x * d - p.ox) / p.s, y: (g.y * d - p.oy) / p.s, size: (g.size * d) / p.s };
  }
  return null;
}

function tick() {
  if (!cam.el || cam.mode !== 'live') return;
  cam.raf = requestAnimationFrame(tick);
  const now = performance.now();
  if (now - cam.last < 180) return;
  cam.last = now;
  readNow();
}

function readNow() {
  const r = guideInSource();
  if (!r) return;
  const W = 240, N = is3() ? 3 : 2;
  work.width = work.height = W;
  workCtx.fillStyle = '#000';
  workCtx.fillRect(0, 0, W, W);
  try { workCtx.drawImage(r.src, r.x, r.y, r.size, r.size, 0, 0, W, W); } catch (e) { return; }
  const px = workCtx.getImageData(0, 0, W, W).data;
  const reads = readFace(px, W, W, { x: 0, y: 0, size: W }, N, camRefs);
  // Live view: steady out flicker by voting over the last few looks.
  cam.hist.push(reads);
  if (cam.hist.length > (cam.mode === 'live' ? 4 : 1)) cam.hist.shift();
  cam.reads = reads.map((r0, c) => {
    const votes = {};
    cam.hist.forEach((h) => { const col = h[c].color; votes[col] = (votes[col] || 0) + 1; });
    const [best, n] = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
    const color = best === 'null' ? null : best;
    return { ...r0, color, sure: r0.sure && n === cam.hist.length && color === r0.color };
  });
  showReads();
}

function showReads() {
  const reads = cam.reads, k = app.side;
  cam.el.querySelectorAll('#cam-guide .g-cell').forEach((cell, c) => {
    const r = reads[c], dot = cell.firstElementChild;
    dot.style.background = r.color ? HEX[r.color] : 'transparent';
    cell.classList.toggle('unsure', !!r.color && !r.sure);
    cell.classList.toggle('empty', !r.color);
  });
  const missing = reads.some((r) => !r.color);
  const expect = is3() ? CENTER3[STEPS3[k]] : null;
  const offCenter = is3() && reads[4].color && reads[4].color !== expect;
  const shiny = reads.some((r) => r.why === 'shiny');
  const unsure = reads.some((r, c) => !r.sure && !(is3() && c === 4));
  cam.el.querySelector('#cam-use').disabled = missing;
  if (missing) setTip(cam.mode === 'photo' ? t('camTipFillPhoto') : t('camTipCloser'));
  else if (offCenter) setTip(t('camTipCenter', { color: faceColor3(k) }));
  else if (shiny) setTip(t('camTipShiny'));
  else if (unsure) setTip(cam.mode === 'live' ? t('camTipStill') : t('camTipUnsure'));
  else setTip(t('camTipGood'));
}

function useReadings() {
  if (!cam.reads) return;
  const k = app.side, row = entryNow()[k];
  const doubts = [];
  cam.reads.forEach((r, c) => {
    if (is3() && c === 4) return;
    if (r.color) row[c] = r.color;
    if (!r.sure) doubts.push({ k, c });
  });
  // The middle square's real color is known on a 3x3: remember how this light shows it.
  if (is3()) {
    const mid = cam.reads[4], expect = CENTER3[STEPS3[k]];
    if (mid && mid.color === expect && mid.hue !== undefined && mid.sat >= 0.4) camRefs[expect] = mid.hue;
  }
  app.unsure = app.unsure.filter((u) => u.k !== k).concat(doubts);
  app.flags = app.flags.filter((f) => f.k !== k);
  closeCamera();
  save();
  refreshSide();
  const first = panelEl.querySelector('#next') || panelEl.querySelector('#check');
  if (first) first.focus();
}

window.addEventListener('resize', () => { if (cam.el) { layoutCam(); if (cam.mode === 'photo') readNow(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.mode === 'live') closeCamera(); });

// ===== Start =====
let restartArmed = false, restartTimer = null;
function disarm() { restartArmed = false; clearTimeout(restartTimer); restartBtn.textContent = t('startOver'); restartBtn.classList.remove('armed'); }
restartBtn.addEventListener('click', () => {
  if (!restartArmed) {
    restartArmed = true;
    restartBtn.textContent = t('startOverArmed');
    restartBtn.classList.add('armed');
    restartTimer = setTimeout(disarm, 2600);
    return;
  }
  disarm();
  resetAll();
  go('welcome');
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const base = computeS();
    if (cam.el) return;
    if ((model.N === 2 ? base : Math.round(base * 2 / 3)) !== S) { stopLoops(); buildCube(); render(false); }
  }, 200);
});

disarm();
restore();
useModel(app.cube);
if (app.cube === 3 && app.screen !== 'welcome') preloadSolver().catch(() => {});
render(false);
})();
</script>
</body>
